name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Cancel a superseded run rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # Building here rather than letting Oryx do it. Oryx infers both the
      # package manager and the Node version, and its Node support has lagged;
      # Next 16 requires >= 20.9. Pinning it explicitly removes the guesswork
      # and gives us somewhere to assert on the output before it ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check colour contrast
        run: npm run check:contrast

      - name: Build
        run: npm run build
        env:
          # Add these two under Settings -> Secrets and variables -> Actions.
          # Unset, the verification meta tags simply do not render, so the
          # build works fine before the Search Console properties exist.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}

      - name: Verify the export
        run: |
          # distDir must stay unset. If it is ever pointed at out/, Next writes
          # server bundles and build manifests into the folder Azure uploads to
          # the public CDN.
          test ! -d out/server || { echo "::error::server bundles found in out/"; exit 1; }
          test ! -d out/cache  || { echo "::error::build cache found in out/";    exit 1; }

          # The og:image is referenced from six places and silently 404'd for a
          # year, because navigationFallback answered with the 404 page's HTML.
          test -f out/og-image.png || { echo "::error::og-image.png missing";     exit 1; }

          # The PDF engine (~1.5 MB) must stay out of the first-paint bundle.
          # This checks the HTML; the stronger check -- grepping the chunks the
          # HTML references, for the PDF engine and the QR encoder both -- runs
          # in the "Report bundle size" step below.
          if grep -q "react-pdf\|fontkit\|yoga-layout" out/index.html; then
            echo "::error::PDF engine is referenced from index.html -- the lazy import regressed"
            exit 1
          fi

          # Structured data is inert metadata: _document emits it server-side,
          # so it must never reach a client chunk. If it does, someone moved a
          # schema node into a page's next/head and every landing page added
          # later will ship its own copy in the bundle.
          if grep -rq "applicationSubCategory" out/_next/static/chunks/; then
            echo "::error::WebApplication JSON-LD is in the client bundle -- emit it from _document"
            exit 1
          fi

      - name: Verify the sitemap covers the export
        run: npm run check:sitemap

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        # Runs against the real export on desktop and mobile: the invoice flow,
        # the saved-data store, PDF generation, and axe over the interactive
        # states a static crawl never reaches (dialog open, combobox open).
        run: npm test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Report bundle size
        # A ceiling, not a report. 154.2 KB gzip on the home page today.
        #
        # History, so the trend is visible rather than just the number:
        #   145    baseline
        #   148    payment block -- logo picker, seven payment fields, UPI link
        #   152    GST -- 37 state codes, the GSTIN checksum, amount-in-words in
        #          two numbering systems, and eight more form fields, for 4.1 KB
        #   158    content surface -- a shared footer carrying the link hub, the
        #          in-content related-links block, four document types, and the
        #          Rule 46(b) serial-number check, for 3.4 KB
        #
        # Neither raise included the heavy part: the PDF engine and the QR
        # encoder are in lazy chunks, which the same script proves on every run.
        #
        # The four invoice designs cost 1.3 KB, because a design is a palette
        # the preview applies as CSS custom properties rather than a second set
        # of components -- there is no per-design code to keep out of the
        # bundle.
        #
        # Raising this is meant to be a deliberate line in a diff, and it is
        # not the default answer. Anything that can wait for an event handler
        # should be imported there, the way the PDF engine and the QR encoder
        # are.
        run: node scripts/measure-first-paint.mjs --budget=158

      - name: Check the heaviest landing page too
        # The budget above only sees index.html. A landing page renders the same
        # studio plus its own prose, so it is the page that would drift over
        # first -- and /tools/upi-qr-generator/ is the one place a careless
        # static `import` of the QR encoder would look natural, which is
        # exactly what the forbidden-module check exists to catch.
        run: |
          node scripts/measure-first-paint.mjs out quotation-format/index.html --budget=158
          node scripts/measure-first-paint.mjs out tools/upi-qr-generator/index.html --budget=158

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_DUNE_074690A00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # With skip_app_build, the action treats app_location as the folder to
          # upload and ignores output_location -- so this points at the export,
          # not the repo root. Pointing it at "/" makes the deploy fail with
          # "Failed to find a default file in the app artifacts folder".
          app_location: "out"
          output_location: ""
          api_location: ""
          # The build already ran above, on a pinned Node. Oryx would otherwise
          # re-run it and pick its own Node version, which Next 16 may reject.
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_DUNE_074690A00 }}
          action: "close"
